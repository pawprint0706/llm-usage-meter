name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: "LLM Usage Meter.app"
            archive: llm-usage-meter-macos-arm64.zip
          - os: macos-13
            artifact: "LLM Usage Meter.app"
            archive: llm-usage-meter-macos-x64.zip
          - os: windows-latest
            artifact: llm-usage-meter.exe
            archive: llm-usage-meter-windows-x64.zip
          - os: ubuntu-22.04
            artifact: llm-usage-meter
            archive: llm-usage-meter-linux-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0"

      - name: Install Linux GUI build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Build standalone binary
        shell: bash
        run: python packaging/build.py --clean

      - name: Smoke-test binary CLI
        shell: bash
        run: |
          set -e
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            BIN="dist/LLM Usage Meter.app/Contents/MacOS/llm-usage-meter"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            BIN="dist/llm-usage-meter.exe"
          else
            BIN="dist/llm-usage-meter"
            chmod +x "$BIN"
          fi
          # Windowed builds may not print, but --stop must exit successfully
          # when nothing is running (or with a non-crash status).
          "$BIN" --help >/tmp/llm-meter-help.txt 2>&1 || true
          "$BIN" --stop >/tmp/llm-meter-stop.txt 2>&1 || true
          echo "smoke ok: $BIN"

      - name: Package artifact
        shell: bash
        run: |
          set -e
          mkdir -p release
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a "../release/${{ matrix.archive }}" "${{ matrix.artifact }}"
          else
            zip -r "../release/${{ matrix.archive }}" "${{ matrix.artifact }}"
          fi
          ls -lh "../release/${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten archives
        run: |
          mkdir -p upload
          find artifacts -type f -name '*.zip' -exec cp {} upload/ \;
          ls -lh upload

      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
